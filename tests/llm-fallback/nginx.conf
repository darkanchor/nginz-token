daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    log_format m2_phase6 '$request_uri|$llm_replacement_happened|$llm_resolution_outcome|$llm_effective_provider|$llm_fallback_attempted';
    log_format m2_phase7 '$request_uri|$llm_fallback_attempted|$llm_fallback_effective_provider|$llm_effective_model';
    log_format m2_phase8 '$request_uri|$llm_fallback_attempted|$llm_fallback_policy_mismatch|$llm_fallback_suppressed_reason';

    # Single-server upstream: no-retry test always hits 19002, preserving p4_up's round-robin.
    upstream p4_primary_up {
        server 127.0.0.1:19002;
    }

    # Two-server upstream for retry test: nginx tries 19002 first, retries to 19003.
    upstream p4_up {
        server 127.0.0.1:19002;
        server 127.0.0.1:19003;
    }

    # Milestone 2: dedicated single-server upstreams for deterministic routing tests.
    upstream p6_openai_up    { server 127.0.0.1:19002; }
    upstream p6_anthropic_up { server 127.0.0.1:19003; }
    # Phase 7: each location gets its own upstream so round-robin starts at server[0] = 19009.
    # 19009 is never listening → connect error → proxy_next_upstream → 19003 (secondary mock).
    upstream p7_model_ce_up  { server 127.0.0.1:19009; server 127.0.0.1:19003; }
    # Phase 8: one upstream per location so round-robin state is independent per test.
    upstream p8_allow_ce_up    { server 127.0.0.1:19009; server 127.0.0.1:19003; }
    upstream p8_disc_ce_up     { server 127.0.0.1:19009; server 127.0.0.1:19003; }
    upstream p8_forbid_ce_up   { server 127.0.0.1:19009; server 127.0.0.1:19003; }
    upstream p8_same_openai_ce_up { server 127.0.0.1:19009; server 127.0.0.1:19003; }

    upstream p4_429_allowed_up {
        server 127.0.0.1:19002;
        server 127.0.0.1:19003;
    }

    upstream p4_429_mismatch_up {
        server 127.0.0.1:19002;
        server 127.0.0.1:19003;
    }

    # First upstream is intentionally not listening; nginx should retry to 19003 on connect error.
    upstream p4_connect_up {
        server 127.0.0.1:19009;
        server 127.0.0.1:19003;
    }

    # Dedicated connect-error upstream for max-attempts enforcement tests so
    # round-robin state is isolated from the generic connect-retry scenario.
    upstream p4_connect_limit_up {
        server 127.0.0.1:19009;
        server 127.0.0.1:19003;
    }

    server {
        listen 8888;

        # Phase 1: scaffold enabled.
        location /scaffold {
            llm_fallback;
            return 200 "ok";
        }

        # Phase 2: basic route graph, single edge.
        location /single-route {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_max_attempts 2;
            return 200 "ok";
        }

        # Phase 2: basic route graph, two-edge chain (A→B→C).
        location /chain {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_route anthropic azure;
            llm_fallback_max_attempts 3;
            return 200 "ok";
        }

        # Phase 3: failure taxonomy — all failure class tokens.
        location /p3-classes {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error transport_timeout rate_limited upstream_5xx;
            llm_fallback_max_attempts 2;
            return 200 "ok";
        }

        # Phase 3: streaming suppression off.
        location /p3-no-stream {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_allow_streaming off;
            llm_fallback_max_attempts 2;
            return 200 "ok";
        }

        # Phase 4: no-retry baseline — single upstream so round-robin never advances to 19003.
        location /p4-no-retry {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on upstream_5xx;
            llm_fallback_max_attempts 2;
            proxy_pass http://p4_primary_up;
        }

        # Phase 4: retry on upstream_5xx via proxy_next_upstream.
        # llm_proxy classifies the request; llm_fallback provides the route policy.
        # nginx retries to the next server in p4_up when the first returns 5xx.
        location /p4-retry {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            # No provider-changing route: nginx peer retry stays within openai.
            llm_fallback_on upstream_5xx;
            llm_fallback_max_attempts 2;
            proxy_next_upstream http_500 http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p4_up;
        }

        # Phase 4 hardening: connect error should retry to the secondary and surface the reason.
        location /p4-connect-retry {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            # No provider-changing route: nginx peer retry stays within openai.
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p4_connect_up;
        }

        # Phase 4 hardening: if no retry happens for a streaming request, suppression must be explicit.
        location /p4-stream-suppressed {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on upstream_5xx;
            llm_fallback_allow_streaming off;
            llm_fallback_max_attempts 2;
            proxy_pass http://p4_primary_up;
        }

        location /p4-429-allowed {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            # No provider-changing route: nginx peer retry stays within openai.
            llm_fallback_on rate_limited;
            llm_fallback_max_attempts 2;
            proxy_next_upstream http_429 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p4_429_allowed_up;
        }

        location /p4-429-mismatch {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            # No provider-changing route: nginx peer retry stays within openai.
            llm_fallback_on upstream_5xx;
            llm_fallback_max_attempts 2;
            proxy_next_upstream http_429 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p4_429_mismatch_up;
        }

        location /p4-max-attempts-enforced {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_fallback;
            llm_fallback_mode basic;
            # No provider-changing route: nginx peer retry stays within openai.
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 1;
            proxy_pass http://p4_connect_limit_up;
        }

        # ── Milestone 2 Target 1 (Phase 6): pre-send replacement ─────────────

        # No replacement: openai requests go to openai upstream.
        location /p6-no-replace {
            llm_proxy;
            llm_proxy_route openai p6_openai_up;
            llm_proxy_default_provider openai;
            llm_fallback;

            add_header X-LLM-Replacement-Happened $llm_replacement_happened;
            add_header X-LLM-Resolution-Outcome   $llm_resolution_outcome;
            add_header X-LLM-Effective-Provider   $llm_effective_provider;

            access_log logs/m2_phase6.log m2_phase6;
            proxy_pass http://p6_openai_up;
        }

        # Replacement active: openai resolved → replaced by anthropic before send.
        # proxy_pass points to p6_anthropic_up (the replacement target) so the request
        # physically hits the anthropic mock at 19003.
        location /p6-replace {
            llm_proxy;
            llm_proxy_route openai    p6_openai_up;
            llm_proxy_route anthropic p6_anthropic_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_replace openai anthropic;

            add_header X-LLM-Replacement-Happened $llm_replacement_happened;
            add_header X-LLM-Resolution-Outcome   $llm_resolution_outcome;
            add_header X-LLM-Effective-Provider   $llm_effective_provider;

            access_log logs/m2_phase6.log m2_phase6;
            proxy_pass http://p6_anthropic_up;
        }

        # ── Milestone 2 Target 2 (Phase 7): model override on fallback route ──
        # Uses p7_ce_up: 19009 (connect error) as primary, 19003 (secondary mock) as backup.
        # Deterministic: connect error always triggers retry to backup regardless of round-robin.

        location /p7-model-override {
            llm_proxy;
            llm_proxy_route openai    p7_model_ce_up;
            llm_proxy_route anthropic p7_model_ce_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic claude-3-sonnet-20240229;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;

            access_log logs/m2_phase7.log m2_phase7;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p7_model_ce_up;
        }

        # ── Milestone 2 Target 3 (Phase 8): translation fallback policy ───────
        # Each location has its own upstream group so its round-robin starts at server[0] = 19009.

        location /p8-translation-forbid {
            llm_proxy;
            llm_proxy_route openai    p8_forbid_ce_up;
            llm_proxy_route anthropic p8_forbid_ce_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            llm_fallback_translation_fallback forbid;

            access_log logs/m2_phase8.log m2_phase8;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p8_forbid_ce_up;
        }

        location /p8-translation-discourage {
            llm_proxy;
            llm_proxy_route openai    p8_disc_ce_up;
            llm_proxy_route anthropic p8_disc_ce_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            llm_fallback_translation_fallback discourage;

            access_log logs/m2_phase8.log m2_phase8;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p8_disc_ce_up;
        }

        location /p8-translation-allow {
            llm_proxy;
            llm_proxy_route openai    p8_allow_ce_up;
            llm_proxy_route anthropic p8_allow_ce_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            llm_fallback_translation_fallback allow;

            access_log logs/m2_phase8.log m2_phase8;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p8_allow_ce_up;
        }

        location /p8-translation-forbid-same-dialect-route {
            llm_proxy;
            llm_proxy_route openai    p8_same_openai_ce_up openai;
            llm_proxy_route anthropic p8_same_openai_ce_up openai;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            llm_fallback_translation_fallback forbid;

            access_log logs/m2_phase8.log m2_phase8;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://p8_same_openai_ce_up;
        }
    }
}
