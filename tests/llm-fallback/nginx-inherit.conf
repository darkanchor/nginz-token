daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;

        # Parent sets mode, route, and max_attempts; child inherits all.
        location /parent {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_max_attempts 2;
            return 200 "parent";

            location /parent/child {
                llm_fallback;
                return 200 "child";
            }
        }
    }
}
