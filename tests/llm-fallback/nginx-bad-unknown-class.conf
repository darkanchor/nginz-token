daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;
        location / {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error unknown_class;
            return 200 "ok";
        }
    }
}
