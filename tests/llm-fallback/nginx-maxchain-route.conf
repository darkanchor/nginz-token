daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;
        # Valid acyclic chain of 4 routes: A→B→C→D→E.
        # Tests that has_cycle() does not produce a false positive for the
        # longest valid chain starting from A (3 successful hops before dead end).
        location / {
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route provA provB;
            llm_fallback_route provB provC;
            llm_fallback_route provC provD;
            llm_fallback_route provD provE;
            llm_fallback_on upstream_5xx;
            return 200 "ok";
        }
    }
}
