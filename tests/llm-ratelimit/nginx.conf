daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    log_format rl_m2 '$request_uri|$llm_resolution_outcome|$llm_requested_provider|$llm_effective_provider';

    llm_ratelimit_zone default_zone 1m;

    # M2 Target 5: cost rate card for spend-budget integration tests.
    # 50 prompt + 50 completion tokens (mock backend) × rate = 0.001 USD per request.
    llm_cost_rate openai gpt-4o 5.0 15.0;
    # Anthropic mock returns 10 input + 5 output tokens; these rates also total 0.001 CNY.
    llm_cost_rate anthropic claude- 50.0 100.0;
    llm_cost_rate_unit openai usd;
    llm_cost_rate_unit anthropic cny;
    llm_cost_backend log;

    upstream rl_capture_up { server 127.0.0.1:19021; }

    # Phase 3+4 mock backend — returns a full OpenAI chat.completion with usage.
    upstream openai_p34 { server 127.0.0.1:8892; }

    # M2 Target 2: mock Anthropic backend for translation tests.
    upstream anthropic_m2 { server 127.0.0.1:8895; }
    upstream rl_fallback_ce_up { server 127.0.0.1:19009; server 127.0.0.1:8895; }

    # M2 mock Anthropic backend — accepts any request, returns minimal Anthropic response.
    server {
        listen 8895;
        default_type application/json;
        location / {
            return 200 '{"id":"msg_test","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-3-haiku-20240307","stop_reason":"end_turn","usage":{"input_tokens":10,"output_tokens":5}}';
        }
    }

    # Mock backend (Phase 1/2)
    server {
        listen 8891;
        location / {
            return 200 '{"choices":[{"message":{"content":"ok"}}]}';
        }
        # Simulate a provider semantic error (4xx)
        location /provider-error {
            return 422 '{"error":{"message":"bad request"}}';
        }
    }

    # Mock backend (Phase 3/4) — response includes usage (total_tokens=100)
    server {
        listen 8892;
        default_type application/json;
        location / {
            return 200 '{"id":"test","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":50,"completion_tokens":50,"total_tokens":100}}';
        }
    }

    server {
        listen 8888;

        # ── Phase 1: basic enforcement ─────────────────────────────────────
        # 3 req/min, no burst.  Key from X-RL-Key header.
        location /rl {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason    $llm_ratelimit_deny_reason;
            add_header X-RL-Remaining      $llm_ratelimit_quota_remaining;

            proxy_pass http://127.0.0.1:8891;
        }

        # 2 req/min + 1 burst = 3 total.
        location /rl-burst {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 2;
            llm_ratelimit_burst_requests 1;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason    $llm_ratelimit_deny_reason;
            add_header X-RL-Remaining      $llm_ratelimit_quota_remaining;

            proxy_pass http://127.0.0.1:8891;
        }

        # Missing key → fail open (allow, set deny-reason variable)
        location /rl-fail-open {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_key $http_x_nonexistent_header;
            llm_ratelimit_fail_open on;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason;

            proxy_pass http://127.0.0.1:8891;
        }

        # Missing key → fail closed (deny)
        location /rl-fail-closed {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_key $http_x_nonexistent_header;
            llm_ratelimit_fail_open off;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason;

            proxy_pass http://127.0.0.1:8891;
        }

        # dry_run on: observe but never deny.
        location /rl-dry-run {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 2;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_dry_run on;

            add_header X-RL-Deny-Reason    $llm_ratelimit_deny_reason;
            add_header X-RL-Remaining      $llm_ratelimit_quota_remaining;

            proxy_pass http://127.0.0.1:8891;
        }

        # Not enabled — module is a no-op.
        location /plain {
            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason;
            proxy_pass http://127.0.0.1:8891;
        }

        location /subrequest-ssi-parent {
            ssi on;
            default_type text/html;
            return 200 '<!--# include virtual="/subrequest-rl-child" -->';
        }

        location /subrequest-auth-parent {
            auth_request /subrequest-rl-child;
            proxy_pass http://127.0.0.1:8891;
        }

        location /subrequest-mirror-parent {
            mirror /subrequest-rl-child;
            proxy_pass http://127.0.0.1:8891;
        }

        location /subrequest-rl-child {
            internal;
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_key $http_x_rl_key;
            proxy_pass http://rl_capture_up;
        }

        # ── Phase 2: response-aware ────────────────────────────────────────
        # Provider error (422) — quota should still be consumed.
        # `always` so the headers appear on non-2xx upstream responses too.
        location /rl-provider-error {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://127.0.0.1:8891/provider-error;
        }

        # Worker-death invariant probes. The external capture upstream can be
        # delayed so ACCESS has committed quota before the worker is killed.
        location /rl-kill-rpm {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 1;
            llm_ratelimit_key $http_x_rl_key;
            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            proxy_pass http://rl_capture_up;
        }

        location /rl-kill-tpm {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_tokens_per_minute 100;
            llm_ratelimit_reserve_tokens 100;
            llm_ratelimit_key $http_x_rl_key;
            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            proxy_pass http://rl_capture_up;
        }

        location /rl-kill-spend {
            llm_proxy;
            llm_proxy_route openai rl_capture_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;
            llm_ratelimit_reserve_spend usd 0.001;
            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            proxy_pass http://rl_capture_up;
        }

        # ── Phase 3: token budgets ─────────────────────────────────────────
        # Pure reservation (no llm-proxy): tpm=200, reserve=100 → 2 requests fit.
        location /rl-tpm {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 20;
            llm_ratelimit_tokens_per_minute 200;
            llm_ratelimit_reserve_tokens 100;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason  $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining    $llm_ratelimit_quota_remaining always;
            add_header X-RL-Tok-Remaining $llm_ratelimit_token_quota_remaining always;

            proxy_pass http://127.0.0.1:8891;
        }

        # Token reconciliation: llm-proxy extracts usage (total_tokens=100 per
        # request).  tpm=500, reserve=300.  Without reconciliation request 2
        # would be denied (300+300=600>500).  With reconciliation after request 1
        # token_count=100, so request 2 is 100+300=400<=500 → allowed.
        location /rl-tokens {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 20;
            llm_ratelimit_tokens_per_minute 500;
            llm_ratelimit_reserve_tokens 300;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason  $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining    $llm_ratelimit_quota_remaining always;
            add_header X-RL-Tok-Remaining $llm_ratelimit_token_quota_remaining always;

            proxy_pass http://openai_p34;
        }

        # ── Milestone 2 Target 1: org/project/client quota isolation ──────
        # The key variable is a composite header; distinct org:project values
        # prove independent counters without any new code in the module.
        location /rl-composite-key {
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 2;
            llm_ratelimit_key $http_x_quota_scope;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://127.0.0.1:8891;
        }

        # ── Milestone 2 Target 2: translated-traffic quota ─────────────────
        # translated_rpm=2 applies when requested_dialect != effective_dialect.
        # The mock anthropic upstream (8895) accepts translated requests.
        location /rl-translated {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_route anthropic anthropic_m2 anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern claude- anthropic;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_translated_rpm 2;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://anthropic_m2;
        }

        location /rl-rejected-out-of-scope {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 2;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            access_log logs/ratelimit-m2.log rl_m2;
            proxy_pass http://openai_p34;
        }

        # Native-path (openai→openai) does NOT trigger translation penalty.
        location /rl-native {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 3;
            llm_ratelimit_translated_rpm 1;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://openai_p34;
        }

        location /rl-replace-logged {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_route anthropic anthropic_m2 anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_fallback;
            llm_fallback_replace openai anthropic;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_key $http_x_rl_key;

            access_log logs/ratelimit-m2.log rl_m2;
            proxy_pass http://anthropic_m2;
        }

        location /rl-fallback-logged {
            llm_proxy;
            llm_proxy_route openai rl_fallback_ce_up;
            llm_proxy_route anthropic rl_fallback_ce_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_key $http_x_rl_key;

            access_log logs/ratelimit-m2.log rl_m2;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://rl_fallback_ce_up;
        }

        # ── Milestone 2 Target 3: model_basis effective ────────────────────
        # model_basis effective (default): tier uses $llm_effective_model.
        # When there is no replacement, effective == requested, so the existing
        # model override tests continue to apply.
        location /rl-model-basis {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_model_rpm gpt-4o 2;
            llm_ratelimit_model_basis effective;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://openai_p34;
        }

        # ── Phase 4: policy tiers ──────────────────────────────────────────
        # Model tier override: base=10 RPM, gpt-4o=2 RPM.
        # llm-proxy parses request body and sets $llm_model.
        location /rl-model-override {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_model_rpm gpt-4o 2;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://openai_p34;
        }

        # Provider RPM override: base=10 RPM, openai=2 RPM.
        location /rl-provider-rpm {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 10;
            llm_ratelimit_provider_rpm openai 2;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining   $llm_ratelimit_quota_remaining always;

            proxy_pass http://openai_p34;
        }

        # ── Milestone 2 Target 5: monthly spend budgets ────────────────────
        # Each request costs 0.001 USD (50 prompt × $5/M + 50 completion × $15/M).
        # Budget of 0.001 USD is exhausted after 1 request; second is denied.

        # Org-scope spend budget: budget = 0.001 USD → allows 1 request, denies 2nd.
        location /rl-spend-org {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://openai_p34;
        }

        # Opt-in hard admission: reserve the expected per-request spend in
        # ACCESS and reconcile it to actual cost in LOG.
        location /rl-spend-hard-reserve {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;
            llm_ratelimit_reserve_spend usd 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://openai_p34;
        }

        # Project-scope spend budget with multi-level identity.
        location /rl-spend-project {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope project usd $http_x_org_id $http_x_project_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://openai_p34;
        }

        # Client-scope spend budget with org/project/client identity.
        location /rl-spend-client {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope client usd $http_x_org_id $http_x_project_id $http_x_client_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://openai_p34;
        }

        # Dry-run spend: budget already exhausted but dry_run=on → observe, never deny.
        location /rl-spend-dry-run {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_dry_run on;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;

            proxy_pass http://openai_p34;
        }

        # Larger budget (2 USD) — never exhausted in test; confirm spend counter accumulates.
        location /rl-spend-accumulate {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 2.000;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;

            proxy_pass http://openai_p34;
        }

        # Mixed-unit spend budget. USD and CNY budgets share the same org id but
        # must be checked independently based on the effective provider unit.
        location /rl-spend-mixed-unit-usd {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_route anthropic anthropic_m2 anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt- openai;
            llm_proxy_model_pattern claude- anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;
            llm_ratelimit_spend_scope organization cny $http_x_org_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://openai_p34;
        }

        location /rl-spend-mixed-unit-cny {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_route anthropic anthropic_m2 anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_model_pattern gpt- openai;
            llm_proxy_model_pattern claude- anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_cost;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope organization usd $http_x_org_id 0.001;
            llm_ratelimit_spend_scope organization cny $http_x_org_id 0.001;

            add_header X-RL-Deny-Reason $llm_ratelimit_deny_reason always;
            add_header X-RL-Spend-Unit  $llm_ratelimit_spend_deny_unit always;

            proxy_pass http://anthropic_m2;
        }

        # Provider TPM override: base=500 TPM, openai=150 TPM.
        location /rl-provider-tpm {
            llm_proxy;
            llm_proxy_route openai openai_p34;
            llm_proxy_default_provider openai;

            llm_ratelimit;
            llm_ratelimit_requests_per_minute 20;
            llm_ratelimit_tokens_per_minute 500;
            llm_ratelimit_reserve_tokens 100;
            llm_ratelimit_provider_tpm openai 150;
            llm_ratelimit_key $http_x_rl_key;

            add_header X-RL-Deny-Reason  $llm_ratelimit_deny_reason always;
            add_header X-RL-Remaining    $llm_ratelimit_quota_remaining always;
            add_header X-RL-Tok-Remaining $llm_ratelimit_token_quota_remaining always;

            proxy_pass http://openai_p34;
        }
    }
}
