daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;
env LLMMETRICS_TEST_OPENAI_KEY;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    llm_metrics_zone default 1m;

    server {
        listen 8891;
        default_type application/json;
        location / {
            return 200 '{"id":"chatcmpl-1","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"hi"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}';
        }
        location /provider-error {
            return 422 '{"error":{"message":"invalid request","type":"invalid_request_error"}}';
        }
    }

    server {
        listen 8888;

        location /auth-resolved {
            llm_metrics;
            llm_metrics_label_auth_status on;
            llm_metrics_emit_usage on;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMMETRICS_TEST_OPENAI_KEY;

            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;
            proxy_pass http://127.0.0.1:8891;
        }

        location /auth-missing-credential {
            llm_metrics;
            llm_metrics_label_auth_status on;

            llm_auth;
            llm_auth_provider anthropic;

            proxy_pass http://127.0.0.1:8891;
        }

        location /auth-missing-provider {
            llm_metrics;
            llm_metrics_label_auth_status on;

            llm_auth;

            proxy_pass http://127.0.0.1:8891;
        }

        location /auth-missing-secret {
            llm_metrics;
            llm_metrics_label_auth_status on;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMMETRICS_TEST_MISSING_KEY;

            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;
            proxy_pass http://127.0.0.1:8891;
        }

        location /auth-provider-error {
            llm_metrics;
            llm_metrics_label_auth_status on;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMMETRICS_TEST_OPENAI_KEY;

            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;
            proxy_pass http://127.0.0.1:8891/provider-error;
        }

        location /no-auth {
            llm_metrics;
            proxy_pass http://127.0.0.1:8891;
        }

        location /metrics {
            llm_metrics_export prometheus;
        }
    }
}
