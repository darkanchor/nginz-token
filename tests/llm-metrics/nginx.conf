daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

# Explicit single worker so reload tests exercise generation overlap on one
# slot (matching MAX_WORKERS slot hashing) rather than spreading load.
worker_processes 1;

events {
    # /plain is a self-proxy (client + upstream sockets). The graceful-reload
    # stress test fires 160 concurrent GETs; each needs 2 connections, and
    # old+new workers briefly overlap during SIGHUP. 64 is far too small —
    # nginx logs "worker_connections are not enough, reusing connections"
    # then RSTs in-flight sockets (client ECONNRESET / upstream 502).
    worker_connections 1024;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    llm_metrics_zone default 1m;

    # Mock OpenAI backend — returns a full chat.completion with usage.
    server {
        listen 8891;
        default_type application/json;
        location / {
            return 200 '{"id":"chatcmpl-1","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"hi"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}';
        }
        # Simulate a provider semantic error (4xx body)
        location /provider-error {
            return 422 '{"error":{"message":"invalid request","type":"invalid_request_error"}}';
        }
        # Simulate a gateway transport error (502)
        location /gateway-error {
            return 502 '';
        }
    }

    # Mock Anthropic backend — returns messages response with usage.
    server {
        listen 8892;
        default_type application/json;
        location / {
            return 200 '{"id":"msg-1","type":"message","role":"assistant","content":[{"type":"text","text":"hi"}],"model":"claude-3-5-sonnet-20241022","stop_reason":"end_turn","usage":{"input_tokens":8,"output_tokens":4}}';
        }
    }

    server {
        listen 8888;

        # ── OpenAI location (parsed request body, usage extraction) ────────
        location /openai {
            llm_metrics;
            llm_metrics_emit_usage on;

            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;

            proxy_pass http://127.0.0.1:8891;
        }

        # ── Anthropic location ─────────────────────────────────────────────
        location /anthropic {
            llm_metrics;
            llm_metrics_emit_usage on;

            llm_proxy;
            llm_proxy_route anthropic 127.0.0.1:8892 anthropic;
            llm_proxy_default_provider anthropic;

            proxy_pass http://127.0.0.1:8892;
        }

        # ── Fallback: no llm-proxy — counters still work, body_parsed=0 ───
        location /plain {
            llm_metrics;
            proxy_pass http://127.0.0.1:8891;
        }

        # ── Provider error shape ───────────────────────────────────────────
        location /provider-error {
            llm_metrics;
            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;
            proxy_pass http://127.0.0.1:8891/provider-error;
        }

        # ── Gateway error (non-provider 5xx) ──────────────────────────────
        location /gateway-error {
            llm_metrics;
            proxy_pass http://127.0.0.1:8891/gateway-error;
        }

        # ── Milestone 2 Target 1: translation/replacement/outcome counters ─
        # OpenAI → Anthropic translation: body is OpenAI format (inferred) but effective provider
        # is anthropic → effective_dialect="anthropic" ≠ requested_dialect="openai" → translation_happened=1.
        location /openai-to-anthropic {
            llm_metrics;
            llm_metrics_emit_usage on;
            llm_metrics_label_resolution_outcome on;

            llm_proxy;
            llm_proxy_route anthropic 127.0.0.1:8892 anthropic;
            llm_proxy_default_provider anthropic;

            proxy_pass http://127.0.0.1:8892;
        }

        # With llm_fallback_replace: replacement_happened=1, resolution_outcome=replaced_by_policy.
        location /with-replacement {
            llm_metrics;
            llm_metrics_label_resolution_outcome on;

            llm_proxy;
            llm_proxy_route openai    127.0.0.1:8891;
            llm_proxy_route anthropic 127.0.0.1:8892 anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_replace openai anthropic;

            proxy_pass http://127.0.0.1:8892;
        }

        # ── Milestone 2 Target 2: per-tenant counters (opt-in, bounded) ──
        location /with-tenant {
            llm_metrics;
            llm_metrics_label_tenant on;
            llm_metrics_tenant_source $http_x_tenant;

            llm_proxy;
            llm_proxy_route openai 127.0.0.1:8891;
            llm_proxy_default_provider openai;

            proxy_pass http://127.0.0.1:8891;
        }

        # ── Metrics scrape endpoint ───────────────────────────────────────
        location /metrics {
            llm_metrics_export prometheus;
        }

        location /metrics-ssi-parent {
            ssi on;
            default_type text/html;
            return 200 '<!--# include virtual="/metrics" -->';
        }

        location /metrics-auth-parent {
            auth_request /metrics;
            proxy_pass http://127.0.0.1:8891;
        }

        location /metrics-mirror-parent {
            mirror /metrics;
            proxy_pass http://127.0.0.1:8891;
        }
    }
}
