daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    server {
        listen 8888;

        location /bad {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant_credential tenant-a openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            proxy_pass http://127.0.0.1:8889;
        }
    }
}
