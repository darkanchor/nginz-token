daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    server {
        listen 8888;

        location /bad {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai cred-a;
            llm_auth_credential openai cred-b;
            proxy_pass http://127.0.0.1:8889;
        }
    }
}
