daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

# Phase 3: allow these env vars to survive nginx's default env stripping.
env LLMAUTH_TEST_OPENAI_KEY;
env LLMAUTH_TEST_ANTHROPIC_KEY;
env LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
env LLMAUTH_TEST_TENANT_B_OPENAI_KEY;
env LLMAUTH_TEST_PROJECT_A_KEY;
env LLMAUTH_TEST_PROJECT_B_KEY;
env LLMAUTH_TEST_ORG_KEY;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    upstream auth_capture_up {
        server 127.0.0.1:19011;
    }

    server {
        listen 8889;
        location / {
            return 200 '{"choices":[{"message":{"content":"ok"}}]}';
        }
    }

    server {
        listen 8888;

        location /resolved {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai cred-openai;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Key-Source $llm_auth_key_source always;
            add_header X-LLM-Auth-Key-Fingerprint $llm_auth_key_fingerprint always;

            proxy_pass http://127.0.0.1:8889;
        }

        # Additive secret-safe literal form. The public id is observable while
        # the secret suffix is used only for the upstream Authorization header.
        location /literal-id-resolved {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai literal-id:shipping-key:literal-shipping-secret;

            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Key-Source $llm_auth_key_source always;
            proxy_pass http://auth_capture_up;
        }

        location /missing-open {
            llm_auth;
            llm_auth_provider anthropic;
            llm_auth_credential openai cred-openai;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /missing-closed {
            llm_auth;
            llm_auth_provider anthropic;
            llm_auth_credential openai cred-openai;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /missing-provider-open {
            llm_auth;
            llm_auth_credential openai cred-openai;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /resolved-anthropic {
            llm_auth;
            llm_auth_provider anthropic;
            llm_auth_credential openai cred-openai;
            llm_auth_credential anthropic cred-anthropic;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /missing-provider-closed {
            llm_auth;
            llm_auth_credential openai cred-openai;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /subrequest-ssi-parent {
            ssi on;
            default_type text/html;
            return 200 '<!--# include virtual="/subrequest-auth-child" -->';
        }

        location /subrequest-auth-parent {
            auth_request /subrequest-auth-child;
            proxy_pass http://127.0.0.1:8889;
        }

        location /subrequest-mirror-parent {
            mirror /subrequest-auth-child;
            proxy_pass http://127.0.0.1:8889;
        }

        location /subrequest-auth-child {
            internal;
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai cred-openai;
            proxy_pass http://auth_capture_up;
        }

        # Phase 2: llm-proxy execution path owns upstream auth mutation.
        location /phase2-openai-resolved {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;

            proxy_pass http://auth_capture_up;
        }

        location /phase2-anthropic-resolved {
            llm_proxy;
            llm_proxy_route anthropic auth_capture_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern claude- anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_auth;
            llm_auth_credential anthropic env:LLMAUTH_TEST_ANTHROPIC_KEY;

            proxy_pass http://auth_capture_up;
        }

        location /phase2-openai-missing-open {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_MISSING_VAR;
            llm_auth_fail_closed off;

            proxy_pass http://auth_capture_up;
        }

        location /phase2-openai-missing-closed {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_MISSING_VAR;
            llm_auth_fail_closed on;

            proxy_pass http://auth_capture_up;
        }

        # Phase 4: tenant / BYOK routing.
        location /phase4-tenant-resolved {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant $http_x_llm_tenant;
            llm_auth_tenant_credential tenant-a openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            llm_auth_tenant_credential tenant-b openai env:LLMAUTH_TEST_TENANT_B_OPENAI_KEY;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://auth_capture_up;
        }

        location /phase4-tenant-fallback-open {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant $http_x_llm_tenant;
            llm_auth_tenant_credential tenant-a openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;
            llm_auth_tenant_fallback_shared on;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://auth_capture_up;
        }

        location /phase4-tenant-fallback-closed {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant $http_x_llm_tenant;
            llm_auth_tenant_credential tenant-a openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://auth_capture_up;
        }

        location /phase5-tenant-missing-open {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant $http_x_llm_tenant;
            llm_auth_tenant_credential tenant-a openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Fail-Reason $llm_auth_fail_reason always;

            proxy_pass http://127.0.0.1:8889;
        }

        # ── Milestone 2 Target 1: identity context variables ──────────────
        location /m2t1-identity-vars {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;
            llm_auth_tenant $http_x_llm_client;
            llm_auth_project $http_x_llm_project;
            llm_auth_org $http_x_llm_org;
            llm_auth_tenant_fallback_shared on;

            add_header X-LLM-Auth-Client $llm_auth_client always;
            add_header X-LLM-Auth-Project $llm_auth_project always;
            add_header X-LLM-Auth-Org $llm_auth_org always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        # Missing org/project yields explicit fail reason, not generic missing_credential.
        location /m2t1-org-missing-closed {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_org $http_x_llm_org;
            llm_auth_org_credential org-acme openai env:LLMAUTH_TEST_ORG_KEY;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Fail-Reason $llm_auth_fail_reason always;

            proxy_pass http://127.0.0.1:8889;
        }

        # ── Milestone 2 Target 2: org/project credential selection ────────
        # project-A and project-B get different credentials for the same provider.
        location /m2t2-project-resolved {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_project $http_x_llm_project;
            llm_auth_project_credential project-a openai env:LLMAUTH_TEST_PROJECT_A_KEY;
            llm_auth_project_credential project-b openai env:LLMAUTH_TEST_PROJECT_B_KEY;
            llm_auth_fail_closed on;

            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Project $llm_auth_project always;

            proxy_pass http://auth_capture_up;
        }

        # project credential preferred over org credential (project > org in cascade).
        location /m2t2-project-over-org {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_project $http_x_llm_project;
            llm_auth_org $http_x_llm_org;
            llm_auth_project_credential project-alpha openai env:LLMAUTH_TEST_PROJECT_A_KEY;
            llm_auth_org_credential org-acme openai env:LLMAUTH_TEST_ORG_KEY;
            llm_auth_tenant_fallback_shared on;

            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://auth_capture_up;
        }

        # Client BYOK isolation: client credential must not bleed across different clients.
        location /m2t2-client-byok {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_provider openai;
            llm_auth_tenant $http_x_llm_client;
            llm_auth_project $http_x_llm_project;
            llm_auth_tenant_credential byok-client openai env:LLMAUTH_TEST_TENANT_A_OPENAI_KEY;
            llm_auth_project_credential shared-project openai env:LLMAUTH_TEST_PROJECT_A_KEY;
            llm_auth_tenant_fallback_shared on;

            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://auth_capture_up;
        }

        # Phase 3: env-backed secret sources.
        location /env-openai-resolved {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Key-Source $llm_auth_key_source always;
            add_header X-LLM-Auth-Key-Fingerprint $llm_auth_key_fingerprint always;
            add_header X-LLM-Auth-Fail-Reason $llm_auth_fail_reason always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /env-anthropic-resolved {
            llm_auth;
            llm_auth_provider anthropic;
            llm_auth_credential anthropic env:LLMAUTH_TEST_ANTHROPIC_KEY;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /env-missing {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai env:LLMAUTH_TEST_MISSING_VAR;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;

            proxy_pass http://127.0.0.1:8889;
        }

        # Phase 3: file-backed secret sources.
        # Paths are relative to the config file directory (fixtures/ is a sibling of nginx.conf).
        location /file-openai-resolved {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai file:fixtures/openai-test.key;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Key-Source $llm_auth_key_source always;
            add_header X-LLM-Auth-Key-Fingerprint $llm_auth_key_fingerprint always;

            proxy_pass http://127.0.0.1:8889;
        }

        location /file-missing {
            llm_auth;
            llm_auth_provider openai;
            llm_auth_credential openai file:fixtures/nonexistent.key;
            llm_auth_fail_closed off;

            add_header X-LLM-Auth-Provider $llm_auth_provider always;
            add_header X-LLM-Auth-Credential $llm_auth_credential always;
            add_header X-LLM-Auth-Status $llm_auth_status always;
            add_header X-LLM-Auth-Key-Source $llm_auth_key_source always;
            add_header X-LLM-Auth-Key-Fingerprint $llm_auth_key_fingerprint always;
            add_header X-LLM-Auth-Fail-Reason $llm_auth_fail_reason always;

            proxy_pass http://127.0.0.1:8889;
        }

        # Inheritance / override group.
        # Parent defines credentials and fail_closed; children selectively inherit or override.
        location /inherit-parent/ {
            llm_auth_credential openai cred-parent-openai;
            llm_auth_fail_closed on;

            # Child inherits parent's credentials (child defines none of its own).
            location /inherit-parent/inherit-creds {
                llm_auth;
                llm_auth_provider openai;

                add_header X-LLM-Auth-Provider $llm_auth_provider always;
                add_header X-LLM-Auth-Credential $llm_auth_credential always;
                add_header X-LLM-Auth-Status $llm_auth_status always;

                proxy_pass http://127.0.0.1:8889;
            }

            # Child overrides parent's credential by defining its own.
            location /inherit-parent/override-creds {
                llm_auth;
                llm_auth_provider openai;
                llm_auth_credential openai cred-child-openai;

                add_header X-LLM-Auth-Provider $llm_auth_provider always;
                add_header X-LLM-Auth-Credential $llm_auth_credential always;
                add_header X-LLM-Auth-Status $llm_auth_status always;

                proxy_pass http://127.0.0.1:8889;
            }

            # Child inherits fail_closed=on from parent; no credential for anthropic -> 500.
            location /inherit-parent/inherit-fail-closed {
                llm_auth;
                llm_auth_provider anthropic;

                add_header X-LLM-Auth-Provider $llm_auth_provider always;
                add_header X-LLM-Auth-Status $llm_auth_status always;

                proxy_pass http://127.0.0.1:8889;
            }

            # Child overrides fail_closed to off; no credential for anthropic -> 200 + missing_credential.
            location /inherit-parent/override-fail-closed {
                llm_auth;
                llm_auth_provider anthropic;
                llm_auth_fail_closed off;

                add_header X-LLM-Auth-Provider $llm_auth_provider always;
                add_header X-LLM-Auth-Status $llm_auth_status always;

                proxy_pass http://127.0.0.1:8889;
            }
        }
    }
}
