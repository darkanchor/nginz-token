daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    server {
        listen 8888;

        location /bad-project-weaken {
            llm_security;
            llm_security_mode detect;
            llm_security_org_rules_file fixtures/org-block.rules;
            llm_security_project_rules_file fixtures/project-weaken.rules;
            return 200 "ok";
        }
    }
}
