daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    upstream mock_up { server 127.0.0.1:19001; }
    upstream anthropic_up { server 127.0.0.1:8895; }

    server {
        listen 8895;
        default_type application/json;
        location / {
            return 200 '{"id":"msg_test","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-3-haiku-20240307","stop_reason":"end_turn","usage":{"input_tokens":10,"output_tokens":5}}';
        }
    }

    server {
        listen 8888;

        # Phase 1: scaffold enabled — no mode or rules, no traffic change.
        location /scaffold {
            llm_security;
            return 200 "ok";
        }

        # Phase 2: detect mode with rules file.
        location /detect {
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            return 200 "ok";
        }

        # Phase 2: block mode with rules file.
        location /block {
            llm_security;
            llm_security_mode block;
            llm_security_rules_file fixtures/test.rules;
            return 200 "ok";
        }

        # Phase 3: detect mode — security runs on request body via llm-proxy.
        # proxy_pass required so ACCESS phase body handler fires.
        location /p3-detect {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            add_header X-Sec-Detected $llm_security_detected;
            add_header X-Sec-Blocked  $llm_security_blocked;
            add_header X-Sec-Rule-Id  $llm_security_rule_id;
            add_header X-Sec-Action   $llm_security_action;
            proxy_pass http://mock_up;
        }

        # Phase 3: block mode — violation causes 403 before upstream is reached.
        location /p3-block {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode block;
            llm_security_rules_file fixtures/test.rules;
            add_header X-Sec-Detected $llm_security_detected;
            add_header X-Sec-Blocked  $llm_security_blocked;
            proxy_pass http://mock_up;
        }

        # Explicit compatibility escape hatch. Omission defaults to rejection.
        location /p3-oversized-legacy {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_proxy_max_body_size 1k;
            llm_security;
            llm_security_mode block;
            llm_security_rules_file fixtures/test.rules;
            llm_security_reject_oversized_request off;
            proxy_pass http://mock_up;
        }

        location /p3-oversized-reject {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_proxy_max_body_size 1k;
            llm_security;
            llm_security_mode block;
            llm_security_rules_file fixtures/test.rules;
            proxy_pass http://mock_up;
        }

        # Phase 4: response detect mode — security inspects upstream response body.
        # Note: response-phase variables are set in the body filter (after headers sent),
        # so they cannot be exposed via add_header. Tests verify body content instead.
        location /p4-detect-resp {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        # Phase 4: response redact mode — violation is redacted in-place.
        location /p4-redact-resp {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        location /p4-oversized-legacy {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_proxy_max_response_size 1k;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            llm_security_reject_oversized_response off;
            proxy_pass http://mock_up;
        }

        location /p4-oversized-reject {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_proxy_max_response_size 1k;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        # Phase 4 hardening: short response bodies must not underflow redaction scans.
        location /p4-redact-short-safe {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/long-only.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        location /p4-redact-stream {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        # Flaw fix: request-side redact rule action canonicalized to block.
        # A rule with |redact: action in request inspection must report action=block,
        # not action=redact, since no body modification happens before send.
        location /p3-redact-rule {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/block-redact.rules;
            add_header X-Sec-Detected $llm_security_detected always;
            add_header X-Sec-Blocked  $llm_security_blocked  always;
            add_header X-Sec-Action   $llm_security_action   always;
            proxy_pass http://mock_up;
        }

        # Flaw fix: response redaction replaces ALL occurrences, not just the first.
        location /p4-redact-all-occurrences {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode redact;
            llm_security_rules_file fixtures/test.rules;
            llm_security_inspect_response on;
            proxy_pass http://mock_up;
        }

        # M2 Target 1: $llm_security_inspection_path observability.
        # native-path (openai→openai): translation_happened=0 → path="native".
        location /m2-inspection-path {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            add_header X-Sec-Detected        $llm_security_detected;
            add_header X-Sec-Inspection-Path $llm_security_inspection_path;
            proxy_pass http://mock_up;
        }

        location /m2-inspection-path-translated {
            llm_proxy;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            add_header X-Sec-Detected        $llm_security_detected;
            add_header X-Sec-Inspection-Path $llm_security_inspection_path;
            proxy_pass http://anthropic_up;
        }

        # M2 Target 1: detect/block works on native path without forcing translation.
        location /m2-native-block {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode block;
            llm_security_rules_file fixtures/test.rules;
            add_header X-Sec-Inspection-Path $llm_security_inspection_path;
            proxy_pass http://mock_up;
        }

        location /m2-org-project-strengthen {
            llm_proxy;
            llm_proxy_default_provider openai;
            llm_security;
            llm_security_mode detect;
            llm_security_org_rules_file fixtures/org.rules;
            llm_security_project_rules_file fixtures/project-tighten.rules;
            llm_security_org $http_x_org;
            llm_security_project $http_x_project;
            add_header X-Sec-Detected      $llm_security_detected;
            add_header X-Sec-Blocked       $llm_security_blocked;
            add_header X-Sec-Rule-Id       $llm_security_rule_id;
            add_header X-Sec-Action        $llm_security_action;
            add_header X-Sec-Org           $llm_security_org;
            add_header X-Sec-Project       $llm_security_project;
            add_header X-Sec-Policy-Source $llm_security_policy_source;
            proxy_pass http://mock_up;
        }
    }
}
