daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;
        location / {
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/too-many.rules;
            proxy_pass http://127.0.0.1:1;
        }
    }
}
