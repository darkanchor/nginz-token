daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;
        location / {
            llm_security;
            llm_security_mode scan;
            llm_security_rules_file fixtures/test.rules;
            return 200 "ok";
        }
    }
}
