daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events { worker_connections 16; }

http {
    server {
        listen 8888;

        # Parent sets mode and rules; child inherits both via merge_loc_conf.
        location /parent {
            llm_security;
            llm_security_mode detect;
            llm_security_rules_file fixtures/test.rules;
            return 200 "parent";

            location /parent/child {
                llm_security;
                return 200 "child";
            }
        }
    }
}
