daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    # Differentiated rate cards: openai at $1/$3 per million, anthropic at $5/$15.
    # With 50 prompt + 50 completion tokens:
    #   openai:    50*1.0/1M + 50*3.0/1M  = 0.00020000
    #   anthropic: 50*5.0/1M + 50*15.0/1M = 0.00100000
    # The distinct totals let tests verify which rate card was applied.
    llm_cost_rate openai    ""                       1.0  3.0;
    llm_cost_rate anthropic claude-3-haiku-20240307  5.0 15.0;
    llm_cost_rate_unit openai usd;
    llm_cost_rate_unit anthropic usd;
    llm_cost_backend postgres;
    llm_cost_dsn "host=127.0.0.1 port=25432 dbname=test user=test password=test";
    llm_cost_table llm_cost_events;

    log_format cost_fmt '{"status":"$llm_cost_status","total":"$llm_cost_total","effective_provider":"$llm_effective_provider","outcome":"$llm_resolution_outcome"}';
    access_log logs/cost.log cost_fmt;

    # Anthropic mock: returns valid Anthropic-format response with 50+50 tokens.
    server {
        listen 8895;
        default_type application/json;
        location / {
            return 200 '{"id":"msg_test","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-3-haiku-20240307","stop_reason":"end_turn","usage":{"input_tokens":50,"output_tokens":50}}';
        }
    }

    # Primary upstream: port 19009 is never listening → connect error on first attempt.
    # Second server: anthropic mock at 8895 → nginx retries here after connect error.
    upstream fallback_up {
        server 127.0.0.1:19009;
        server 127.0.0.1:8895;
    }
    upstream anthropic_up { server 127.0.0.1:8895; }

    server {
        listen 8888;

        # Failure-driven fallback billing test:
        # Request resolves to openai (from gpt-4o catalog); primary fails with connect error;
        # nginx retries to anthropic mock. Cost must use anthropic rate card ($5/$15 per million).
        location /cost-fallback-billing {
            llm_proxy;
            llm_proxy_route openai    fallback_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_cost;
            llm_fallback;
            llm_fallback_mode basic;
            llm_fallback_route openai anthropic claude-3-haiku-20240307;
            llm_fallback_on connect_error;
            llm_fallback_max_attempts 2;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error timeout non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://fallback_up;
        }
    }
}
