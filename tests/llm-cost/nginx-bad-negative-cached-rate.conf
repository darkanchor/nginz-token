daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    llm_cost_rate openai gpt-4o 5.0 15.0;
    llm_cost_cached_rate openai gpt-4o 2.5 -3.0;
    llm_cost_backend log;

    server {
        listen 8888;
        location / {
            llm_cost;
            return 200 "{}";
        }
    }
}
