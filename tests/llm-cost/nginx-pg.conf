daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    llm_ratelimit_zone cost_pg_spend_zone 1m;

    llm_cost_rate openai gpt-4o 5.0 15.0;
    llm_cost_rate anthropic claude-3-haiku-20240307 5.0 15.0;
    llm_cost_rate_unit openai usd;
    llm_cost_rate_unit anthropic usd;
    llm_cost_backend postgres;
    llm_cost_dsn "host=127.0.0.1 port=25432 dbname=test user=test password=test";
    llm_cost_table llm_cost_events;
    llm_cost_rate_card_version 2026-05-19-test;

    log_format cost_fmt '{"event_id":"$llm_cost_event_id","status":"$llm_cost_status","prompt":"$llm_cost_prompt","completion":"$llm_cost_completion","total":"$llm_cost_total"}';
    access_log logs/cost.log cost_fmt;

    server {
        listen 8892;
        default_type application/json;
        location / {
            return 200 '{"id":"t","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":50,"completion_tokens":50,"total_tokens":100}}';
        }
        location /err {
            return 401 '{"error":{"message":"invalid provider key","type":"invalid_request_error"}}';
        }
    }

    server {
        listen 8895;
        default_type application/json;
        location / {
            return 200 '{"id":"msg_test","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-3-haiku-20240307","stop_reason":"end_turn","usage":{"input_tokens":50,"output_tokens":50}}';
        }
    }

    upstream openai_up { server 127.0.0.1:8892; }
    upstream anthropic_up { server 127.0.0.1:8895; }

    server {
        listen 8888;

        location /cost-pg {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_cost_identity $http_x_identity;
            llm_cost_user $http_x_user;
            llm_cost_team $http_x_team;
            llm_cost_auth_fingerprint $http_x_auth_fingerprint;
            llm_cost_traffic_cohort $http_x_traffic_cohort;
            proxy_pass http://openai_up;
        }

        # Postgres down → persist_failed
        location /cost-pg-fail {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }

        # Standard provisioning interaction: postgres cost backend, spend
        # reconciliation, reload, then a provider semantic error. Keep the
        # access log free of cost variables so LOG-phase ordering matches the
        # shipping configuration.
        location /cost-pg-error-spend {
            access_log off;
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_cost_identity $http_x_key_id;
            llm_cost_org $http_x_org_id;
            llm_cost_project $http_x_project_id;
            llm_cost_client $http_x_client_id;
            llm_cost_team $http_x_project_id;
            llm_cost_auth_fingerprint $http_x_auth_fingerprint;
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope project usd $http_x_org_id $http_x_project_id 10;
            proxy_pass http://127.0.0.1:8892/err;
        }

        # ── M2 Target 2: org/project/client attribution ───────────────────
        location /cost-pg-scope {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_cost_identity $http_x_identity;
            llm_cost_user $http_x_user;
            llm_cost_team $http_x_team;
            llm_cost_auth_fingerprint $http_x_auth_fingerprint;
            llm_cost_org     $http_x_org;
            llm_cost_project $http_x_project;
            llm_cost_client  $http_x_client;
            proxy_pass http://openai_up;
        }

        location /cost-pg-replace {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_cost;
            llm_fallback;
            llm_fallback_replace openai anthropic;
            proxy_pass http://anthropic_up;
        }

        location /cost-pg-rejected {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }

        # no_rate postgres persistence: model not in rate card but tokens are present.
        # Verifies that no_rate requests write a postgres row (Bug fix: was silently dropped).
        location /cost-pg-no-rate {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }
    }
}
