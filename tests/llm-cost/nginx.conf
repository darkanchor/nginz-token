daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    llm_ratelimit_zone cost_spend_zone 1m;

    # Rate card: openai gpt-4o at $5/M prompt, $15/M completion.
    # 50 prompt + 50 completion tokens (from mock) →
    #   prompt:  50 * 5.0  / 1,000,000 = 0.00025000
    #   compl:   50 * 15.0 / 1,000,000 = 0.00075000
    #   total:                           0.00100000
    llm_cost_rate openai gpt-4o 5.0 15.0;
    llm_cost_rate anthropic claude-3-haiku-20240307 5.0 15.0;
    llm_cost_rate anthropic claude-sonnet 3.0 15.0;
    llm_cost_rate anthropic claude-readonly 3.0 15.0;
    llm_cost_rate_unit openai usd;
    llm_cost_rate_unit anthropic usd;

    # Cached-input rates for Target 5 tests (per million tokens).
    # OpenAI: cache reads only at $2.50/M (no create rate).
    llm_cost_cached_rate openai gpt-4o 2.50;
    # Anthropic: cache reads at $0.30/M, cache creates at $3.75/M.
    llm_cost_cached_rate anthropic claude-sonnet 0.30 3.75;
    # Anthropic read-only cache rate; cache creates fall back to prompt rate.
    llm_cost_cached_rate anthropic claude-readonly 0.30;

    # Log backend (default) — variables available in log_format.
    llm_cost_backend log;

    # Structured cost log used for test assertions (M2 fields included).
    log_format cost_fmt '{"status":"$llm_cost_status","prompt":"$llm_cost_prompt","completion":"$llm_cost_completion","total":"$llm_cost_total","req_provider":"$llm_cost_requested_provider","req_model":"$llm_cost_requested_model","translation":"$llm_cost_translation_happened","outcome":"$llm_cost_resolution_outcome","provider":"$llm_provider","model":"$llm_model"}';
    access_log logs/cost.log cost_fmt;

    # Mock backend: usage prompt=50 completion=50 total=100, model=gpt-4o
    server {
        listen 8892;
        default_type application/json;
        location / {
            return 200 '{"id":"t","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":50,"completion_tokens":50,"total_tokens":100}}';
        }
        location /err {
            return 422 '{"error":{"message":"bad request"}}';
        }
        # OpenAI with cached tokens: prompt=100, cache_read=80, completion=20
        # Regular tokens: 100 - 80 = 20
        # prompt_cost = 20 * 5.0/M + 80 * 2.5/M = 0.0001 + 0.0002 = 0.0003
        # completion_cost = 20 * 15.0/M = 0.0003
        # total = 0.0006
        location /with-cache {
            return 200 '{"id":"c","object":"chat.completion","model":"gpt-4o","choices":[{"index":0,"message":{"role":"assistant","content":"ok"},"finish_reason":"stop"}],"usage":{"prompt_tokens":100,"completion_tokens":20,"total_tokens":120,"prompt_tokens_details":{"cached_tokens":80}}}';
        }
    }

    server {
        listen 8895;
        default_type application/json;
        location / {
            return 200 '{"id":"msg_test","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-3-haiku-20240307","stop_reason":"end_turn","usage":{"input_tokens":50,"output_tokens":50}}';
        }
        # Anthropic with cached tokens: input=25, cache_read=80, cache_create=10, output=8
        # Total prompt: 25 + 80 + 10 = 115
        # prompt_cost = 25*3.0/M + 80*0.30/M + 10*3.75/M = 0.000075 + 0.000024 + 0.0000375 = 0.0001365
        # completion_cost = 8 * 15.0/M = 0.00012
        # total = 0.0002565
        location /with-cache {
            return 200 '{"id":"msg_cache","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-sonnet-20241022","stop_reason":"end_turn","usage":{"input_tokens":25,"output_tokens":8,"cache_read_input_tokens":80,"cache_creation_input_tokens":10}}';
        }
        # Anthropic with cache creates and no configured create rate.
        location /with-cache-read-only {
            return 200 '{"id":"msg_cro","type":"message","role":"assistant","content":[{"type":"text","text":"ok"}],"model":"claude-readonly-20241022","stop_reason":"end_turn","usage":{"input_tokens":50,"output_tokens":20,"cache_read_input_tokens":100,"cache_creation_input_tokens":10}}';
        }
    }

    upstream openai_up   { server 127.0.0.1:8892; }
    upstream anthropic_up { server 127.0.0.1:8895; }
    upstream openai_cache_up    { server 127.0.0.1:8892; }
    upstream anthropic_cache_up { server 127.0.0.1:8895; }

    server {
        listen 8888;

        # ── Phase 1: log backend ───────────────────────────────────────────────

        # Known model + usage → status=recorded, costs computed.
        location /cost {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }

        # Upstream 4xx → status=skipped_error (no usage).
        location /cost-err {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://127.0.0.1:8892/err;
        }

        # Shipping interaction: cost observation is consumed by spend
        # reconciliation after a reload and a provider error response.
        location /cost-err-spend {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_ratelimit;
            llm_ratelimit_requests_per_minute 100;
            llm_ratelimit_key $http_x_rl_key;
            llm_ratelimit_spend_scope project usd $http_x_org_id $http_x_project_id 10;
            proxy_pass http://127.0.0.1:8892/err;
        }

        # No llm_proxy → no usage extracted → status=usage_missing.
        location /cost-no-proxy {
            llm_cost;
            proxy_pass http://openai_up;
        }

        # Model not in rate card → status=no_rate.
        # Send a request body with model="claude-3-opus"; llm-proxy sets $llm_model
        # but there is no matching rate entry (only "gpt-4o" is configured).
        location /cost-no-rate {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }

        # ── Phase 2: postgres backend ─────────────────────────────────────────
        # Uses the DSN set by the test via server-level directive.
        # Covered by the phase-2 describe block in the test file.
        location /cost-pg {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            llm_cost_identity $http_x_identity;
            llm_cost_traffic_cohort $http_x_traffic_cohort;
            proxy_pass http://openai_up;
        }

        location /cost-translated {
            llm_proxy;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_cost;
            proxy_pass http://anthropic_up;
        }

        location /cost-rejected {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://openai_up;
        }

        # ── Target 5: cached-input pricing ────────────────────────────────────

        # OpenAI with cache reads: blended prompt cost uses llm_cost_cached_rate.
        location /cost-openai-cached {
            llm_proxy;
            llm_proxy_route openai openai_cache_up;
            llm_proxy_default_provider openai;
            llm_cost;
            proxy_pass http://127.0.0.1:8892/with-cache;
        }

        # Anthropic with cache reads + creates: three-bucket blended cost.
        location /cost-anthropic-cached {
            llm_proxy;
            llm_proxy_route anthropic anthropic_cache_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_cost;
            proxy_pass http://127.0.0.1:8895/with-cache;
        }

        # Anthropic with only cache reads (create rate absent → falls back to prompt rate).
        location /cost-anthropic-cache-read-only {
            llm_proxy;
            llm_proxy_route anthropic anthropic_cache_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;
            llm_cost;
            proxy_pass http://127.0.0.1:8895/with-cache-read-only;
        }
    }
}
