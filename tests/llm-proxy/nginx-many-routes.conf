daemon off;
error_log /dev/null;

events {
    worker_connections 16;
}

http {
    upstream p1 { server 127.0.0.1:9001; }
    upstream p2 { server 127.0.0.1:9002; }
    upstream p3 { server 127.0.0.1:9003; }
    upstream p4 { server 127.0.0.1:9004; }
    upstream p5 { server 127.0.0.1:9005; }
    upstream p6 { server 127.0.0.1:9006; }
    upstream p7 { server 127.0.0.1:9007; }
    upstream p8 { server 127.0.0.1:9008; }
    upstream p9 { server 127.0.0.1:9009; }

    server {
        listen 19998;

        location /many {
            llm_proxy;
            # 9 routes — MAX_ROUTES is 8; the 9th must be warned and ignored
            llm_proxy_route provider1 p1;
            llm_proxy_route provider2 p2;
            llm_proxy_route provider3 p3;
            llm_proxy_route provider4 p4;
            llm_proxy_route provider5 p5;
            llm_proxy_route provider6 p6;
            llm_proxy_route provider7 p7;
            llm_proxy_route provider8 p8;
            llm_proxy_route provider9 p9;
            llm_proxy_default_provider provider1;
        }
    }
}
