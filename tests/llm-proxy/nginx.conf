daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;

env LLMAUTH_TEST_OPENAI_KEY;
env LLMAUTH_TEST_ANTHROPIC_KEY;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log;
    log_format llm_phase5 '$request_uri|$llm_provider|$llm_prompt_tokens|$llm_completion_tokens|$llm_total_tokens';
    log_format llm_phase20 '$request_uri|$llm_prompt_tokens|$llm_cache_read_tokens|$llm_cache_create_tokens|$llm_completion_tokens';
    log_format llm_phase7 '$request_uri|$llm_auth_prepared|$llm_auth_failed|$llm_proxy_auth_fail_reason|$llm_failure_class|$llm_replay_safe|$llm_response_started';
    log_format llm_phase8 '$request_uri|$llm_fallback_attempted|$llm_fallback_attempt_count|$llm_fallback_primary_provider|$llm_fallback_effective_provider|$llm_fallback_reason|$llm_fallback_policy_allowed|$llm_fallback_policy_mismatch|$llm_fallback_suppressed|$llm_fallback_suppressed_reason|$llm_failure_class|$llm_resolution_outcome|$llm_provider_upstream|$llm_provider_host';
    log_format llm_phase9 '$request_uri|$llm_security_detected|$llm_security_blocked|$llm_security_rule_id|$llm_security_action|$llm_security_response_detected|$llm_security_response_blocked|$llm_security_response_rule_id';
    log_format llm_phase14 '$request_uri|$llm_resolution_outcome|$llm_replacement_happened|$llm_fallback_attempted|$llm_fallback_primary_provider|$llm_fallback_effective_provider';
    log_format llm_phase15 '$request_uri|$llm_requested_provider|$llm_requested_model|$llm_requested_dialect|$llm_requested_dialect_source|$llm_effective_provider|$llm_effective_model|$llm_effective_dialect|$llm_resolution_outcome|$llm_translation_happened|$llm_replacement_happened';
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    upstream openai_up         { server 127.0.0.1:8889; }
    upstream anthropic_up      { server 127.0.0.1:8889; }
    upstream body_capture_up   { server 127.0.0.1:19001; }
    upstream openai_dyn_up     { server 127.0.0.1:19002; }
    upstream anthropic_dyn_up  { server 127.0.0.1:19003; }
    upstream phase8_failover_up { server 127.0.0.1:19002; server 127.0.0.1:19003; }
    upstream phase7_connect_up { server 127.0.0.1:19012; }
    upstream phase6_capture_up { server 127.0.0.1:19004; }
    upstream auth_capture_up   { server 127.0.0.1:19011; }
    # Phase 14: connect-error first server (19012 never answers) + working fallback (19002).
    # This is deterministic regardless of round-robin state — 19012 always fails immediately.
    upstream phase14_ce_up { server 127.0.0.1:19012; server 127.0.0.1:19002 backup; }
    upstream phase20_ce_anthropic_up { server 127.0.0.1:19012; server 127.0.0.1:19003 backup; }
    upstream hardening_capture_up { server 127.0.0.1:19005; }

    # Mock backend: minimal chat completion response
    server {
        listen 8889;
        location / {
            return 200 '{"choices":[{"message":{"content":"ok"}}]}';
        }
    }

    server {
        listen 8888;

        # ── Phase 1 tests ──────────────────────────────────────────────────
        # NOTE: `return` runs in rewrite phase; ACCESS handler does not fire
        # here. Tests the header filter only.
        location /llm {
            llm_proxy;
            return 200 '{"status":"ok"}';
        }

        location /plain {
            return 200 '{"status":"ok"}';
        }

        # ── Phase 2: routing ───────────────────────────────────────────────
        # $llm_* variables echoed as response headers for test assertions.
        location /route {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Provider      $llm_provider;
            add_header X-LLM-Model         $llm_model;
            add_header X-LLM-Streaming     $llm_streaming;
            add_header X-LLM-Upstream      $llm_provider_upstream;
            add_header X-LLM-Provider-Host $llm_provider_host;
            add_header X-LLM-Prompt-Tokens $llm_prompt_tokens;
            add_header X-LLM-Completion-Tokens $llm_completion_tokens;
            add_header X-LLM-Total-Tokens $llm_total_tokens;

            proxy_pass http://127.0.0.1:8889;
            proxy_pass_request_headers on;
        }

        # Non-JSON content-type: routes to default (openai)
        location /route-nonjson {
            llm_proxy;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://127.0.0.1:8889;
        }

        # ── Phase 2: variable exposure ─────────────────────────────────────
        # llm_proxy not enabled — variables must be empty/absent
        location /var-echo {
            add_header X-LLM-Provider $llm_provider;
            add_header X-LLM-Model    $llm_model;
            return 200 '{}';
        }

        # ── Phase 2: upstream contract ─────────────────────────────────────
        # Routes to the Bun mock on 19001 for body-capture tests
        location /route-body-capture {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://body_capture_up;
        }

        # Uses the computed upstream variable for actual routing verification.
        location /route-dynamic {
            llm_proxy;
            llm_proxy_route openai    openai_dyn_up;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Provider $llm_provider;
            add_header X-LLM-Upstream $llm_provider_upstream;
            proxy_set_header Host $llm_provider_host;

            proxy_pass http://$llm_provider_upstream;
        }

        # Force nginx to spool the body out of the preread path and tiny in-memory buffers.
        location /route-spill {
            client_body_buffer_size 1k;

            llm_proxy;
            llm_proxy_route openai    openai_dyn_up;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Provider $llm_provider;
            add_header X-LLM-Upstream $llm_provider_upstream;
            proxy_set_header Host $llm_provider_host;

            proxy_pass http://$llm_provider_upstream;
        }

        # ── Subrequest hardening ────────────────────────────────────────────
        location /subrequest-ssi-parent {
            ssi on;
            ssi_silent_errors on;
            default_type text/html;
            return 200 '<!--# include virtual="/subrequest-ssi-child" -->';
        }

        location /subrequest-ssi-child {
            internal;
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            proxy_pass http://openai_dyn_up;
        }

        location /subrequest-auth-parent {
            auth_request /subrequest-auth-child;
            proxy_pass http://127.0.0.1:8889;
        }

        location /subrequest-auth-child {
            internal;
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            proxy_pass http://openai_dyn_up;
        }

        location /subrequest-mirror-parent {
            mirror /subrequest-mirror-child;
            proxy_pass http://127.0.0.1:8889;
        }

        location /subrequest-mirror-child {
            internal;
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 2: config inheritance ────────────────────────────────────
        # Parent has full routing config; child inherits via merge_loc_conf
        location /parent {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Provider $llm_provider;
            add_header X-LLM-Upstream $llm_provider_upstream;

            proxy_pass http://127.0.0.1:8889;

            location /parent/child {
                add_header X-LLM-Provider $llm_provider;
                add_header X-LLM-Upstream $llm_provider_upstream;
                proxy_pass http://127.0.0.1:8889;
            }
        }

        # Phase 3: request body translation
        # Anthropic format translation; normalize_response defaults to on.
        location /phase3-anthropic {
            llm_proxy;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;
            # Compatibility fixture: malformed-body pass-through is explicit.
            llm_proxy_translation_fail_closed off;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://body_capture_up;
        }

        # Anthropic + normalize_response off: body passes through unmodified.
        location /phase3-normalize-off {
            llm_proxy;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response off;
            llm_proxy_provider_version anthropic 2023-06-01;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://body_capture_up;
        }

        # OpenAI streaming: inject_usage defaults to on.
        location /phase3-openai-stream {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://body_capture_up;
        }

        # OpenAI + inject_usage off: no stream_options injected.
        location /phase3-inject-off {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_proxy_inject_usage off;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://body_capture_up;
        }

        # $llm_provider_version variable echoed as response header.
        location /phase3-version {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;
            llm_proxy_provider_version openai    2024-10-01;
            llm_proxy_provider_version anthropic 2023-06-01;

            add_header X-LLM-Provider         $llm_provider;
            add_header X-LLM-Provider-Version $llm_provider_version;

            proxy_pass http://127.0.0.1:8889;
        }

        # ── Phase 4: response normalization ───────────────────────────────────
        # Anthropic response: llm_proxy normalises to OpenAI schema.
        location /phase4-anthropic-normalize {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://anthropic_dyn_up;
        }

        # OpenAI response: no transform, just usage extraction.
        location /phase4-openai-usage {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://openai_dyn_up;
        }

        # Anthropic response with normalize_response off: usage extraction only.
        location /phase4-anthropic-no-normalize {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response off;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://anthropic_dyn_up;
        }

        # Anthropic response with max_response_size set tiny: skip normalisation.
        location /phase4-too-large {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;
            llm_proxy_max_response_size 50;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://anthropic_dyn_up;
        }

        # ── Phase 5: SSE streaming ────────────────────────────────────────────
        # OpenAI SSE: pass through, scan for usage in final chunk.
        location /phase5-openai-stream {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;
            access_log logs/phase5-access.log llm_phase5;

            proxy_buffering off;
            proxy_pass http://openai_dyn_up;
        }

        # Anthropic SSE: rewrite to OpenAI format, extract usage.
        location /phase5-anthropic-stream {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;

            add_header X-LLM-Provider $llm_provider;
            access_log logs/phase5-access.log llm_phase5;

            proxy_buffering off;
            proxy_pass http://anthropic_dyn_up;
        }

        # Anthropic SSE with normalize_response off: pass through, scan for usage.
        location /phase5-anthropic-stream-raw {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response off;

            add_header X-LLM-Provider $llm_provider;
            access_log logs/phase5-access.log llm_phase5;

            proxy_buffering off;
            proxy_pass http://anthropic_dyn_up;
        }

        # ── Target 10: bidirectional dialect translation ──────────────────────
        # Anthropic-dialect client routed to OpenAI endpoint (fixed ingress dialect).
        # Gateway translates request body Anthropic→OpenAI and normalises response OpenAI→Anthropic.
        location /phase21-fixed-anthropic-client {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect anthropic;
            llm_proxy_normalize_response on;
            # Compatibility fixture for non-text/malformed block pass-through.
            llm_proxy_translation_fail_closed off;

            add_header X-LLM-Provider $llm_provider;
            access_log logs/phase15-access.log llm_phase15;

            proxy_pass http://openai_dyn_up;
        }

        # Same but for SSE streaming: rewrite OpenAI SSE → Anthropic SSE.
        location /phase21-fixed-anthropic-client-stream {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect anthropic;
            llm_proxy_normalize_response on;
            llm_proxy_inject_usage on;

            add_header X-LLM-Provider $llm_provider;
            access_log logs/phase15-access.log llm_phase15;

            proxy_buffering off;
            proxy_pass http://openai_dyn_up;
        }

        # Infer dialect from body shape: two routes so we can route to the right upstream.
        location /phase21-infer-client {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode infer;
            llm_proxy_normalize_response on;

            access_log logs/phase15-access.log llm_phase15;

            proxy_pass http://openai_dyn_up;
        }

        # Provider names no longer imply endpoint dialect. No dialect arg means OpenAI.
        location /phase21-provider-name-no-dialect-guess {
            llm_proxy;
            llm_proxy_route vendor-anthropic openai_dyn_up;
            llm_proxy_default_provider vendor-anthropic;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect anthropic;
            llm_proxy_normalize_response on;

            access_log logs/phase15-access.log llm_phase15;

            proxy_pass http://openai_dyn_up;
        }

        # Model names no longer imply provider. Without catalog entries, use default.
        location /phase21-model-name-no-provider-guess {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect openai;

            add_header X-LLM-Provider $llm_provider;
            add_header X-LLM-Effective-Dialect $llm_effective_dialect;

            proxy_pass http://openai_dyn_up;
        }

        # Anthropic client → Anthropic endpoint (native path, no translation).
        location /phase21-native-anthropic {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect anthropic;
            llm_proxy_normalize_response on;

            access_log logs/phase15-access.log llm_phase15;

            proxy_pass http://anthropic_dyn_up;
        }

        # ── Phase 6: provider quirks and production hardening ─────────────────

        # OpenAI rate-limit header parsing: x-ratelimit-reset-tokens and remaining-*.
        # Headers are injected directly by the module (not via add_header) because
        # headers_filter runs before our filter in the runtime chain.
        location /phase6-openai-rl {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            proxy_pass http://openai_dyn_up;
        }

        # Anthropic rate-limit header parsing: retry-after (seconds → ms).
        location /phase6-anthropic-rl {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;

            proxy_pass http://anthropic_dyn_up;
        }

        # OpenAI error shape 401/403 pass-through.
        location /phase6-openai-error {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://openai_dyn_up;
        }

        # Anthropic error shape 401/403 pass-through (normalize_response on).
        location /phase6-anthropic-error {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://anthropic_dyn_up;
        }

        # Tool field preservation: routes to capture mock to inspect forwarded body.
        location /phase6-tools {
            llm_proxy;
            llm_proxy_route anthropic phase6_capture_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://phase6_capture_up;
        }

        # Local OpenAI-compatible provider without usage field.
        location /phase6-local {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 7: auth execution and failure classification ───────────────
        location /phase7-openai-auth {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_OPENAI_KEY;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://auth_capture_up;
        }

        location /phase7-openai-auth-local {
            llm_proxy;
            llm_proxy_route local auth_capture_up;
            llm_proxy_default_provider local;

            llm_auth;
            llm_auth_credential local env:LLMAUTH_TEST_OPENAI_KEY;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://auth_capture_up;
        }

        location /phase7-anthropic-auth {
            llm_proxy;
            llm_proxy_route anthropic auth_capture_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_provider_version anthropic 2023-06-01;

            llm_auth;
            llm_auth_credential anthropic env:LLMAUTH_TEST_ANTHROPIC_KEY;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://auth_capture_up;
        }

        location /phase7-openai-missing-open {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_MISSING_VAR;
            llm_auth_fail_closed off;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://auth_capture_up;
        }

        location /phase7-openai-missing-closed {
            llm_proxy;
            llm_proxy_route openai auth_capture_up;
            llm_proxy_default_provider openai;

            llm_auth;
            llm_auth_credential openai env:LLMAUTH_TEST_MISSING_VAR;
            llm_auth_fail_closed on;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://auth_capture_up;
        }

        location /phase7-openai-semantic-error {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            access_log logs/phase7-access.log llm_phase7;
            proxy_pass http://openai_dyn_up;
        }

        location /phase7-openai-stream {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            access_log logs/phase7-access.log llm_phase7;
            proxy_buffering off;
            proxy_pass http://openai_dyn_up;
        }

        location /phase7-connect-error {
            llm_proxy;
            llm_proxy_route openai phase7_connect_up;
            llm_proxy_default_provider openai;

            access_log logs/phase7-access.log llm_phase7;
            proxy_connect_timeout 100ms;
            proxy_read_timeout 100ms;
            proxy_pass http://phase7_connect_up;
        }

        location /phase7-transport-timeout {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            access_log logs/phase7-access.log llm_phase7;
            proxy_read_timeout 100ms;
            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 8: proxy-owned fallback substrate and caveat surfacing ─────
        location /phase8-retry-upstream-5xx {
            llm_proxy;
            llm_proxy_route openai phase8_failover_up;
            llm_proxy_route anthropic anthropic_dyn_up;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_route openai anthropic;
            llm_fallback_on upstream_5xx;

            add_header X-Fallback-Attempted $llm_fallback_attempted always;
            add_header X-Fallback-Attempt-Count $llm_fallback_attempt_count always;
            add_header X-Fallback-Primary $llm_fallback_primary_provider always;
            add_header X-Fallback-Effective $llm_fallback_effective_provider always;
            add_header X-Fallback-Reason $llm_fallback_reason always;
            add_header X-Fallback-Policy-Allowed $llm_fallback_policy_allowed always;
            add_header X-Fallback-Policy-Mismatch $llm_fallback_policy_mismatch always;
            add_header X-LLM-Failure-Class $llm_failure_class always;

            access_log logs/phase8-access.log llm_phase8;
            proxy_next_upstream http_500 http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://phase8_failover_up;
        }

        location /phase8-semantic-no-retry {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_route openai anthropic;
            llm_fallback_on upstream_5xx;

            add_header X-Fallback-Attempted $llm_fallback_attempted always;
            add_header X-Fallback-Attempt-Count $llm_fallback_attempt_count always;
            add_header X-Fallback-Primary $llm_fallback_primary_provider always;
            add_header X-Fallback-Effective $llm_fallback_effective_provider always;
            add_header X-Fallback-Reason $llm_fallback_reason always;
            add_header X-Fallback-Policy-Allowed $llm_fallback_policy_allowed always;
            add_header X-Fallback-Policy-Mismatch $llm_fallback_policy_mismatch always;
            add_header X-LLM-Failure-Class $llm_failure_class always;

            access_log logs/phase8-access.log llm_phase8;
            proxy_next_upstream http_500 http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 9: security execution substrate ───────────────────────────
        location /phase9-detect-request {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_security;
            llm_security_mode detect;
            llm_security_rules_file ../llm-security/fixtures/test.rules;

            add_header X-Sec-Detected $llm_security_detected always;
            add_header X-Sec-Blocked $llm_security_blocked always;
            add_header X-Sec-Rule-Id $llm_security_rule_id always;
            add_header X-Sec-Action $llm_security_action always;

            access_log logs/phase9-access.log llm_phase9;
            proxy_pass http://openai_dyn_up;
        }

        location /phase9-block-request {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_security;
            llm_security_mode block;
            llm_security_rules_file ../llm-security/fixtures/test.rules;

            add_header X-Sec-Detected $llm_security_detected always;
            add_header X-Sec-Blocked $llm_security_blocked always;
            add_header X-Sec-Rule-Id $llm_security_rule_id always;
            add_header X-Sec-Action $llm_security_action always;

            access_log logs/phase9-access.log llm_phase9;
            proxy_pass http://openai_dyn_up;
        }

        location /phase9-block-rewritten-openai {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_security;
            llm_security_mode block;
            llm_security_rules_file ../llm-security/fixtures/translated.rules;

            access_log logs/phase9-access.log llm_phase9;
            proxy_pass http://openai_dyn_up;
        }

        location /phase9-redact-response {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_security;
            llm_security_mode redact;
            llm_security_rules_file ../llm-security/fixtures/test.rules;
            llm_security_inspect_response on;

            access_log logs/phase9-access.log llm_phase9;
            proxy_pass http://openai_dyn_up;
        }

        # Phase 8: streaming suppression — no proxy_next_upstream http_500, so nginx
        # never retries on 5xx; is_streaming=1 request triggers fallback_suppressed=1.
        location /phase8-streaming-suppress {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_route openai anthropic;
            llm_fallback_on upstream_5xx;

            access_log logs/phase8-access.log llm_phase8;
            proxy_pass http://openai_dyn_up;
        }

        # Phase 9: SSE security redaction — unbounded event-stream, redact mode.
        location /phase9-redact-sse {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            llm_security;
            llm_security_mode redact;
            llm_security_rules_file ../llm-security/fixtures/test.rules;
            llm_security_inspect_response on;

            access_log logs/phase9-access.log llm_phase9;
            proxy_buffering off;
            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 14: explicit replacement and fallback policy ──────────────
        # Normal (no fallback): resolution_outcome = as_requested, replacement_happened = 0
        location /phase14-normal {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            add_header X-LLM-Resolution-Outcome   $llm_resolution_outcome always;
            add_header X-LLM-Replacement-Happened $llm_replacement_happened always;
            add_header X-LLM-Fallback-Attempted   $llm_fallback_attempted always;

            access_log logs/phase14-access.log llm_phase14;
            proxy_pass http://openai_dyn_up;
        }

        # Failover: first server (19012) always fails with connect error, backup (19002) succeeds.
        # Using backup keyword forces nginx to always try 19012 first, so this is deterministic.
        location /phase14-failover {
            llm_proxy;
            llm_proxy_route openai phase14_ce_up;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;

            add_header X-LLM-Resolution-Outcome    $llm_resolution_outcome always;
            add_header X-LLM-Replacement-Happened  $llm_replacement_happened always;
            add_header X-Fallback-Attempted        $llm_fallback_attempted always;
            add_header X-Fallback-Primary          $llm_fallback_primary_provider always;

            access_log logs/phase14-access.log llm_phase14;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error;
            proxy_next_upstream_tries 2;
            proxy_pass http://phase14_ce_up;
        }

        # ── Phase 15: disclosure, observability, and downstream contract ────
        # Disclosure on (default): X-LLM-Provider present in response.
        location /phase15-disclose-on {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;

            # Internal effective_provider still accessible via add_header for test assertion.
            add_header X-Internal-Effective-Provider $llm_effective_provider;

            access_log logs/phase15-access.log llm_phase15;
            proxy_pass http://openai_dyn_up;
        }

        # Disclosure off: X-LLM-Provider must NOT appear in client response.
        # Internal ctx fields still populated (verifiable via log format or add_header).
        location /phase15-disclose-off {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            llm_proxy_disclose_provider off;

            add_header X-Internal-Effective-Provider $llm_effective_provider;

            access_log logs/phase15-access.log llm_phase15;
            proxy_pass http://openai_dyn_up;
        }

        # ── Phase 12: request identity and resolution substrate ─────────────
        # Exposes new $llm_requested_* / $llm_effective_* / $llm_resolution_outcome vars.
        location /phase12-route {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Requested-Provider  $llm_requested_provider;
            add_header X-LLM-Requested-Model     $llm_requested_model;
            add_header X-LLM-Requested-Dialect   $llm_requested_dialect;
            add_header X-LLM-Dialect-Source      $llm_requested_dialect_source;
            add_header X-LLM-Effective-Provider  $llm_effective_provider;
            add_header X-LLM-Effective-Model     $llm_effective_model;
            add_header X-LLM-Effective-Dialect   $llm_effective_dialect;
            add_header X-LLM-Resolution-Outcome  $llm_resolution_outcome;

            proxy_pass http://openai_up;
        }

        # Phase 12: operator model catalog (llm_proxy_model_pattern).
        # When operator catalog is configured, unknown models are rejected (not silently defaulted).
        location /phase12-catalog {
            llm_proxy;
            llm_proxy_model_pattern gpt- openai;
            llm_proxy_model_pattern claude- anthropic;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            # no llm_proxy_default_provider — catalog rejects unknowns

            add_header X-LLM-Effective-Provider $llm_effective_provider;
            add_header X-LLM-Resolution-Outcome $llm_resolution_outcome;

            proxy_pass http://openai_up;
        }

        # Phase 12: explicit provider field in body.
        location /phase12-explicit-provider {
            llm_proxy;
            llm_proxy_route openai    openai_up;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;

            add_header X-LLM-Requested-Provider  $llm_requested_provider;
            add_header X-LLM-Effective-Provider  $llm_effective_provider;
            add_header X-LLM-Resolution-Outcome  $llm_resolution_outcome;

            proxy_pass http://openai_up;
        }

        # Phase 12: dialect_mode=explicit_required — must have fixed ingress or be rejected.
        location /phase12-explicit-required {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode explicit_required;

            add_header X-LLM-Requested-Dialect $llm_requested_dialect;
            add_header X-LLM-Dialect-Source    $llm_requested_dialect_source;

            proxy_pass http://openai_up;
        }

        # Phase 12: dialect_mode=fixed with ingress_dialect.
        location /phase12-fixed-dialect {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_default_provider openai;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect openai;

            add_header X-LLM-Requested-Dialect $llm_requested_dialect;
            add_header X-LLM-Dialect-Source    $llm_requested_dialect_source;

            proxy_pass http://openai_up;
        }

        # Phase 12 / Phase 13: llm_proxy_route with explicit endpoint dialect.
        # Tests that effective_dialect reflects the route's declared dialect.
        location /phase12-route-with-dialect {
            llm_proxy;
            llm_proxy_route openai    openai_up    openai;
            llm_proxy_route anthropic anthropic_up anthropic;
            llm_proxy_default_provider openai;
            llm_proxy_model_pattern gpt-    openai;
            llm_proxy_model_pattern claude- anthropic;

            add_header X-LLM-Effective-Dialect   $llm_effective_dialect;
            add_header X-LLM-Translation-Happened $llm_translation_happened;

            proxy_pass http://openai_up;
        }

        # ── Target 9: cached-token extraction ─────────────────────────────────
        # All phase20 locations use the llm_phase20 access log format.
        # Token variables are evaluated in LOG phase (after body filter), so the
        # access log is the correct place to read cache token values.

        # OpenAI non-streaming: cache read tokens from prompt_tokens_details.
        location /phase20-openai-cached {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            access_log logs/phase20-access.log llm_phase20;
            proxy_pass http://openai_dyn_up;
        }

        # Anthropic non-streaming with normalize on: cache tokens summed into prompt_tokens.
        location /phase20-anthropic-cached-normalize {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;
            access_log logs/phase20-access.log llm_phase20;
            proxy_pass http://anthropic_dyn_up;
        }

        # Anthropic non-streaming with normalize off: same extraction, raw body.
        location /phase20-anthropic-cached-raw {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response off;
            access_log logs/phase20-access.log llm_phase20;
            proxy_pass http://anthropic_dyn_up;
        }

        # OpenAI streaming: cache read tokens in final usage chunk.
        location /phase20-openai-cached-stream {
            llm_proxy;
            llm_proxy_route openai openai_dyn_up;
            llm_proxy_default_provider openai;
            access_log logs/phase20-access.log llm_phase20;
            proxy_buffering off;
            proxy_pass http://openai_dyn_up;
        }

        # Anthropic streaming: cache tokens from message_start.message.usage.
        location /phase20-anthropic-cached-stream {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;
            access_log logs/phase20-access.log llm_phase20;
            proxy_buffering off;
            proxy_pass http://anthropic_dyn_up;
        }

        # Fallback from OpenAI primary to Anthropic response: extract cache fields
        # using the effective provider's Anthropic usage shape.
        location /phase20-fallback-anthropic-cached {
            llm_proxy;
            llm_proxy_route openai    phase20_ce_anthropic_up;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider openai;

            llm_fallback;
            llm_fallback_route openai anthropic;
            llm_fallback_on connect_error;

            access_log logs/phase20-access.log llm_phase20;
            proxy_connect_timeout 100ms;
            proxy_next_upstream error;
            proxy_next_upstream_tries 2;
            proxy_pass http://phase20_ce_anthropic_up;
        }

        # ── Hardening pass: bug/gap probes (do not fix yet) ────────────────

        # Anthropic endpoint with normalize on; used to probe empty 200 response
        # finalization (body_filter calls next(r, NULL) without a last_buf).
        location /hardening-empty-body {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_normalize_response on;

            add_header X-LLM-Provider $llm_provider;

            proxy_pass http://anthropic_dyn_up;
        }

        # Fixed ingress dialect=openai to an Anthropic endpoint. Used to probe
        # rewrite_openai_to_anthropic's handling of non-text content blocks: unlike
        # the reverse direction it does NOT bail on non-text blocks.
        location /hardening-fixed-openai-multimodal {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect openai;
            llm_proxy_normalize_response on;
            llm_proxy_translation_fail_closed off;

            add_header X-LLM-Translation-Happened $llm_translation_happened;

            proxy_pass http://hardening_capture_up;
        }

        # Omitted directive uses the safe default: required translation fails closed.
        location /hardening-fixed-openai-multimodal-strict {
            llm_proxy;
            llm_proxy_route anthropic anthropic_dyn_up anthropic;
            llm_proxy_default_provider anthropic;
            llm_proxy_dialect_mode fixed;
            llm_proxy_ingress_dialect openai;
            llm_proxy_normalize_response on;
            proxy_pass http://hardening_capture_up;
        }
    }
}
