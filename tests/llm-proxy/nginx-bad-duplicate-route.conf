daemon off;
error_log /dev/null;

events {
    worker_connections 16;
}

http {
    upstream openai_up { server 127.0.0.1:9999; }
    upstream anthropic_up { server 127.0.0.1:9998; }

    server {
        listen 19999;

        location /bad {
            llm_proxy;
            llm_proxy_route openai openai_up;
            llm_proxy_route openai anthropic_up;
            llm_proxy_default_provider openai;
        }
    }
}
